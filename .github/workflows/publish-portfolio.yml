name: Publish portfolio package

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/publish-portfolio.yml

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Download portfolio package
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p "$RUNNER_TEMP/portfolio-upload"
          gh release download "portfolio-upload-2026-08-04" \
            --pattern "alexandre-digital-creative-director-v1-45-movement-github-ready.zip" \
            --dir "$RUNNER_TEMP/portfolio-upload"

      - name: Extract and publish
        shell: bash
        run: |
          set -euo pipefail
          export PORTFOLIO_ZIP="$RUNNER_TEMP/portfolio-upload/alexandre-digital-creative-director-v1-45-movement-github-ready.zip"
          export PORTFOLIO_EXTRACT="$RUNNER_TEMP/portfolio-extract"
          mkdir -p "$PORTFOLIO_EXTRACT"

          python - <<'PY'
          import os
          import pathlib
          import shutil
          import zipfile

          archive = pathlib.Path(os.environ["PORTFOLIO_ZIP"])
          destination = pathlib.Path(os.environ["PORTFOLIO_EXTRACT"])

          with zipfile.ZipFile(archive) as source:
              for entry in source.infolist():
                  normalized = entry.filename.replace("\\", "/")
                  parts = pathlib.PurePosixPath(normalized).parts
                  if not parts or any(part in ("", ".", "..") for part in parts):
                      continue
                  target = destination.joinpath(*parts)
                  if entry.is_dir():
                      target.mkdir(parents=True, exist_ok=True)
                  else:
                      target.parent.mkdir(parents=True, exist_ok=True)
                      with source.open(entry) as input_file, target.open("wb") as output_file:
                          shutil.copyfileobj(input_file, output_file)
          PY

          source_dir="$PORTFOLIO_EXTRACT/alexandre-digital-creative-director-v1-45-movement-github-ready"
          test -f "$source_dir/index.html"

          find . -mindepth 1 -maxdepth 1 ! -name '.git' ! -name '.github' -exec rm -rf {} +
          cp -a "$source_dir"/. .
          rm -rf .github

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish digital creative director portfolio"
          git push origin HEAD:main
